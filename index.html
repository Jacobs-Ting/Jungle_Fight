<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jungle Strike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a14; --ink:#f3ead6; --dim:#9aa3b8; --gold:#ffc14a; --ember:#e2572c; --cyan:#5fdcff; --red:#ff5a4a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#070a14; --ink:#f3ead6; } }
:root[data-theme="dark"]{ --bg:#070a14; --ink:#f3ead6; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Chakra Petch","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
#wrap{
  position:relative;
  width:min(100vw, calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 16 / 9));
  aspect-ratio:16/9; max-width:100%;
  box-shadow:0 30px 80px #000c;
  overflow:hidden;
}
canvas{display:block;width:100%;height:100%;background:#1a2340}
#hud{
  position:absolute; left:0; right:0; top:0; display:flex; align-items:center; gap:1em;
  padding:1em 1.2em; font-size:clamp(10px,1.6vw,18px); font-weight:600; pointer-events:none;
  text-shadow:0 2px 6px #000a;
}
.chip{
  display:flex; align-items:center; gap:.6em;
  padding:.35em 1.6em .35em .8em;
  background:linear-gradient(90deg,#070a14d0,#070a1400);
  border-left:3px solid var(--gold);
}
.chip .lbl{color:var(--dim);font-weight:500;font-size:.8em}
.num{font-variant-numeric:tabular-nums;letter-spacing:.06em}
#lives{display:flex;gap:.35em}
.life{width:.85em;height:.85em;border-radius:50%;
  background:linear-gradient(#2a1d16 0 30%, #ff5a4a 30% 48%, #e8a67c 48%);
  box-shadow:0 0 0 1.5px #070a14}
#wpn{margin-left:auto;border-left:none;border-right:3px solid var(--ink);
  background:linear-gradient(270deg,#070a14d0,#070a1400);padding:.35em .8em .35em 1.6em;letter-spacing:.12em}
#wpn[data-w="S"]{color:var(--red);border-color:var(--red)}
#wpn[data-w="R"]{color:var(--cyan);border-color:var(--cyan)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1.2em;
  background:radial-gradient(ellipse at 50% 45%, #070a1460 0%, #070a14e6 75%)}
#overlay[hidden]{display:none}
.panel{text-align:center;max-height:100%;overflow:auto;padding:.5em}
.logo{
  margin:0; font-size:clamp(34px,8.4vw,96px); line-height:.92; font-weight:700; font-style:italic;
  letter-spacing:.01em;
  background:linear-gradient(180deg,#fff4d2 0%,#ffc14a 48%,#e2572c 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 0 #3a1408) drop-shadow(0 14px 24px #000a);
}
.logo.small{font-size:clamp(28px,6vw,68px)}
.tag{margin:.9em 0 1.6em;font-family:"Noto Sans TC","PingFang TC",sans-serif;font-size:clamp(11px,1.6vw,16px);color:var(--dim)}
.keys{display:grid;grid-template-columns:auto auto;gap:.6em 1.1em;justify-content:center;text-align:left;
  font-family:"Noto Sans TC","PingFang TC",sans-serif;font-size:clamp(10px,1.45vw,15px);margin:0 0 1.4em}
.keys dt{text-align:right;white-space:nowrap}
.keys dd{margin:0;align-self:center;color:#d8d2c2}
kbd{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:.85em;display:inline-block;min-width:2em;text-align:center;
  padding:.25em .55em;margin-left:.3em;border-radius:6px;background:#ffffff14;border:1px solid #ffffff30;
  box-shadow:0 2px 0 #ffffff18;color:var(--ink)}
.note{font-family:"Noto Sans TC",sans-serif;font-size:clamp(10px,1.35vw,14px);color:var(--dim);margin:0}
.note b{font-family:"Chakra Petch",sans-serif}
.stat{margin:.35em 0;font-size:clamp(13px,2vw,22px);font-weight:600;letter-spacing:.08em}
.go{margin-top:1.4em;font-family:"Noto Sans TC",sans-serif;font-size:clamp(11px,1.6vw,16px)}
.go b{color:var(--gold);font-family:"Chakra Petch",sans-serif}
@media (prefers-reduced-motion:no-preference){ .go{animation:pulse 1.4s ease-in-out infinite} }
@keyframes pulse{50%{opacity:.35}}
#touch{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:3%;pointer-events:none}
.touch #touch{display:flex}
.pad{display:grid;grid-template-columns:repeat(3,clamp(38px,8vw,58px));grid-template-rows:repeat(3,clamp(38px,8vw,58px));gap:5px}
#touch button{pointer-events:auto;touch-action:none;border:1px solid #ffffff40;background:#070a1480;color:var(--ink);
  font:600 clamp(10px,1.8vw,14px) "Chakra Petch",sans-serif;border-radius:12px;user-select:none;-webkit-user-select:none;backdrop-filter:blur(4px)}
#touch button.on{background:#ffc14a55}
.pad [data-k="w"]{grid-area:1/2}.pad [data-k="a"]{grid-area:2/1}.pad [data-k="d"]{grid-area:2/3}.pad [data-k="s"]{grid-area:3/2}
#touch .jump{width:clamp(68px,13vw,96px);height:clamp(68px,13vw,96px);border-radius:50%;border-color:#ffc14a80}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="chip"><span class="lbl">SCORE</span><span id="score" class="num">000000</span></div>
    <div class="chip"><span id="lives" aria-label="剩餘命數"></span></div>
    <div class="chip"><span class="lbl">BEST</span><span id="hi" class="num">000000</span></div>
    <div id="wpn" class="chip" data-w="N">RIFLE</div>
  </div>
  <div id="overlay">
    <div class="panel" id="panel">
      <h1 class="logo">JUNGLE<br>STRIKE</h1>
      <p class="tag">叢林突擊，一路向右殺出重圍</p>
      <dl class="keys">
        <dt><kbd>A</kbd><kbd>D</kbd></dt><dd>左右移動</dd>
        <dt><kbd>W</kbd></dt><dd>向上瞄準，搭配 A／D 斜上射擊</dd>
        <dt><kbd>S</kbd></dt><dd>趴下；搭配 A／D 斜下射擊；空中時向下射擊</dd>
        <dt><kbd>Space</kbd></dt><dd>跳躍；在平台上按 S＋空白鍵往下跳</dd>
        <dt><kbd>P</kbd></dt><dd>暫停</dd>
      </dl>
      <p class="note">武器自動射擊。擊落飛行膠囊可取得 <b style="color:var(--red)">S</b> 散彈槍或 <b style="color:var(--cyan)">R</b> 機關槍。</p>
      <p class="go">按 <b>Enter</b> 或 <b>空白鍵</b> 開始</p>
    </div>
  </div>
  <div id="touch" aria-hidden="true">
    <div class="pad">
      <button data-k="w">▲</button><button data-k="a">◀</button><button data-k="d">▶</button><button data-k="s">▼</button>
    </div>
    <button class="jump" data-k="jump">JUMP</button>
  </div>
</div>

<script>
(() => {
'use strict';
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
// 世界座標固定 480x270，畫布依實際解析度放大繪製（平滑、非像素風）
const W = 480, H = 270, GROUND = 236, G = 0.38, JUMP_V = -7.6;
let S = 1;
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const r = cvs.getBoundingClientRect();
  cvs.width = Math.max(1, Math.round(r.width * dpr));
  cvs.height = Math.max(1, Math.round(r.height * dpr));
  S = cvs.width / W;
}
new ResizeObserver(resize).observe(cvs);
resize();

const $ = id => document.getElementById(id);
const hudScore = $('score'), hudHi = $('hi'), hudLives = $('lives'), hudWpn = $('wpn');
const overlay = $('overlay'), panel = $('panel');
let hi = 0;
try { hi = +localStorage.getItem('jstrike-hi') || 0; } catch (e) {}

/* ---------- 輸入 ---------- */
const keys = {};
const keyMap = { a:'a', d:'d', w:'w', s:'s', ' ':'jump', arrowleft:'a', arrowright:'d', arrowup:'w', arrowdown:'s' };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), m = keyMap[k];
  if (m) { keys[m] = true; e.preventDefault(); }
  if (k === 'p' && (state === 'play' || state === 'pause')) togglePause();
  if ((k === 'enter' || k === ' ') && (state === 'title' || state === 'over') && !e.repeat) startGame();
});
addEventListener('keyup', e => { const m = keyMap[e.key.toLowerCase()]; if (m) keys[m] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') togglePause(); });
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup','pointerleave','pointercancel'].forEach(t => b.addEventListener(t, off));
});
overlay.addEventListener('pointerdown', () => {
  if (state === 'title' || state === 'over') startGame();
  else if (state === 'pause') togglePause();
});

/* ---------- 狀態 ---------- */
let state = 'title', camX, player, bullets, eBullets, enemies, particles, items, platforms, genX;
let spawnT, capsuleT, score, lives, frame, shake, flashScreen = 0, tick = 0;

function newPlayer(x, y) {
  return { x, y, w:10, h:24, vx:0, vy:0, facing:1, onGround:false, onPlat:false, dropT:0,
    crouch:false, ax:1, ay:0, fireT:0, flashT:0, weapon:'N', inv:120, dead:false, deadT:0,
    anim:0, spin:0, jumpHeld:true };
}
function resetWorld() {
  camX = 0; platforms = []; genX = 220; bullets = []; eBullets = []; enemies = [];
  particles = []; items = []; spawnT = 90; capsuleT = 700; score = 0; lives = 3; frame = 0; shake = 0;
  player = newPlayer(60, GROUND); player.onGround = true;
  genWorld(W * 2);
}
function startGame() {
  resetWorld();
  player.y = GROUND - 90; player.onGround = false;
  state = 'play'; overlay.hidden = true; updateHud();
}
function togglePause() {
  if (state === 'play') {
    state = 'pause';
    panel.innerHTML = '<h1 class="logo small">PAUSED</h1><p class="go">按 <b>P</b> 繼續</p>';
    overlay.hidden = false;
  } else if (state === 'pause') { state = 'play'; overlay.hidden = true; }
}
function gameOver() {
  state = 'over';
  if (score > hi) { hi = score; try { localStorage.setItem('jstrike-hi', hi); } catch (e) {} }
  panel.innerHTML = `<h1 class="logo small">MISSION<br>FAILED</h1>
    <p class="stat" style="margin-top:1em">SCORE ${pad(score)}</p><p class="stat" style="color:var(--dim)">BEST ${pad(hi)}</p>
    <p class="go">按 <b>Enter</b> 或 <b>空白鍵</b> 重新出擊</p>`;
  overlay.hidden = false; updateHud();
}
const pad = n => String(n).padStart(6, '0');
const WNAME = { N:'RIFLE', S:'SPREAD', R:'RAPID' };
function updateHud() {
  hudScore.textContent = pad(score);
  hudHi.textContent = pad(Math.max(hi, score));
  hudLives.innerHTML = '<i class="life"></i>'.repeat(Math.max(0, lives)) || '<span class="lbl">LAST LIFE</span>';
  hudWpn.textContent = WNAME[player.weapon]; hudWpn.dataset.w = player.weapon;
}
const difficulty = () => Math.min(10, frame / 1800 + score / 3000);

/* ---------- 地形 ---------- */
function genWorld(upTo) {
  while (genX < upTo) {
    genX += 50 + Math.random() * 110;
    if (Math.random() < 0.75) {
      const w = (48 + Math.random() * 72) | 0;
      const low = Math.random() < 0.6;
      const y = low ? GROUND - 44 : GROUND - 72;
      platforms.push({ x: genX, y, w });
      if (low && Math.random() < 0.35) {
        const w2 = (36 + Math.random() * 40) | 0;
        platforms.push({ x: genX + ((w - w2) * Math.random() | 0), y: y - 40, w: w2 });
      }
      genX += w;
    }
  }
}
function land(e, prevY) {
  e.onGround = false; e.onPlat = false;
  if (e.y >= GROUND) { e.y = GROUND; e.vy = 0; e.onGround = true; return; }
  if (e.vy < 0 || e.dropT > 0) return;
  for (const pl of platforms) {
    if (e.x + e.w / 2 > pl.x && e.x - e.w / 2 < pl.x + pl.w && prevY <= pl.y && e.y >= pl.y) {
      e.y = pl.y; e.vy = 0; e.onGround = true; e.onPlat = true; return;
    }
  }
}
function physics(e) {
  const py = e.y;
  e.vy = Math.min(e.vy + G, 8); e.y += e.vy;
  if (e.dropT > 0) e.dropT--;
  land(e, py);
}

/* ---------- 主角 ---------- */
function shoulder(p) {
  if (!p.onGround) return { x: p.x, y: p.y - 10 };
  if (p.crouch) return { x: p.x + p.facing * 5.5, y: p.y - 4.5 };
  return { x: p.x + p.facing * 1.2, y: p.y - 18.5 };
}
function aimDir(p) { const l = Math.hypot(p.ax, p.ay); return { dx: p.ax / l, dy: p.ay / l }; }
function fire() {
  const p = player, { dx, dy } = aimDir(p), s = shoulder(p);
  const mx = s.x + dx * 15, my = s.y + dy * 15;
  if (p.weapon === 'S') {
    const base = Math.atan2(dy, dx);
    for (const o of [-0.26, -0.13, 0, 0.13, 0.26])
      bullets.push({ x: mx, y: my, vx: Math.cos(base + o) * 5, vy: Math.sin(base + o) * 5, life: 75, r: 3, kind: 'S' });
  } else {
    const sp = p.weapon === 'R' ? 7.5 : 6.5;
    bullets.push({ x: mx, y: my, vx: dx * sp, vy: dy * sp, life: 80, r: 2, kind: p.weapon });
  }
  p.flashT = 3;
}
function updatePlayer() {
  const p = player;
  if (p.dead) {
    p.deadT--; p.vy += G * 0.6; p.y = Math.min(p.y + p.vy, GROUND); p.x += p.vx;
    if (p.y >= GROUND) p.vx *= 0.85;
    if (p.deadT <= 0) {
      if (lives < 0) gameOver();
      else { player = newPlayer(camX + 50, 10); player.inv = 150; updateHud(); }
    }
    return;
  }
  const L = keys.a, R = keys.d, U = keys.w, D = keys.s, J = keys.jump;
  const dx = (R ? 1 : 0) - (L ? 1 : 0);
  if (dx) p.facing = dx;
  p.crouch = D && p.onGround && !dx && !U;
  p.vx = p.crouch ? 0 : dx * 1.6;
  if (J && !p.jumpHeld && p.onGround) {
    if (D && p.onPlat) { p.dropT = 10; p.onGround = false; }
    else { p.vy = JUMP_V; p.onGround = false; p.spin = 0; }
  }
  p.jumpHeld = J;
  const py = p.y;
  p.vy = Math.min(p.vy + G, 8); p.y += p.vy;
  if (p.dropT > 0) p.dropT--;
  p.x = Math.max(camX + 6, p.x + p.vx);
  const wasAir = !p.onGround;
  land(p, py);
  if (wasAir && p.onGround) dust(p.x, p.y);

  if (U && dx) { p.ax = dx; p.ay = -1; }
  else if (U) { p.ax = 0; p.ay = -1; }
  else if (D && !p.onGround) { p.ax = 0; p.ay = 1; }
  else if (D && dx) { p.ax = dx; p.ay = 1; }
  else { p.ax = p.facing; p.ay = 0; }

  p.h = p.crouch ? 10 : (p.onGround ? 24 : 14);
  p.w = p.crouch ? 18 : 10;
  if (p.onGround && dx) p.anim++;
  if (!p.onGround) p.spin += 0.32;
  if (p.inv > 0) p.inv--;
  if (p.flashT > 0) p.flashT--;
  if (--p.fireT <= 0) { fire(); p.fireT = p.weapon === 'R' ? 5 : p.weapon === 'S' ? 13 : 9; }
  const target = p.x - W * 0.42;
  if (target > camX) camX += (target - camX) * 0.25;
}
function killPlayer() {
  const p = player;
  if (p.dead || p.inv > 0) return;
  p.dead = true; p.deadT = 80; p.vy = -4; p.vx = -p.facing * 1.4;
  lives--; shake = 14; flashScreen = 1;
  explode(p.x, p.y - 12, true);
  updateHud();
}
function hitPlayer(x, y, w, h) {
  const p = player;
  return Math.abs(x - p.x) < (w + p.w) / 2 - 1 && y - h < p.y - 1 && y > p.y - p.h + 1;
}

/* ---------- 敵人 ---------- */
function spawnEnemy() {
  if (enemies.length >= 14) return;
  const r = Math.random(), diff = difficulty();
  if (r < 0.55) {
    const fromLeft = Math.random() < 0.2;
    const x = fromLeft ? camX - 10 : camX + W + 10;
    let y = GROUND;
    const pl = platforms.find(p => x > p.x && x < p.x + p.w);
    if (pl && Math.random() < 0.5) y = pl.y;
    enemies.push({ type:'runner', x, y, w:10, h:22, vy:0, dropT:0, onGround:true, hp:1, anim:0, flash:0,
      vx:(fromLeft ? 1 : -1) * (1.1 + Math.random() * 0.5 + diff * 0.05) });
  } else if (r < 0.8) {
    const cands = platforms.filter(p => p.x > camX + W * 0.55 && p.x + p.w < camX + W + 60);
    let x, y;
    if (cands.length && Math.random() < 0.7) { const p = cands[Math.random() * cands.length | 0]; x = p.x + p.w / 2; y = p.y; }
    else { x = camX + W + 8; y = GROUND; }
    enemies.push({ type:'sniper', x, y, w:12, h:22, vy:0, dropT:0, onGround:true, hp:3, flash:0, muzzle:0,
      facing:-1, shootT:50 + Math.random() * 60 });
  } else {
    const baseY = 50 + Math.random() * 70;
    enemies.push({ type:'drone', x:camX + W + 14, y:baseY, baseY, w:16, h:10, hp:2, flash:0,
      vx:-(0.9 + Math.random() * 0.6), t:Math.random() * 6, shootT:80 + Math.random() * 60 });
  }
}
function spawnCapsule() {
  const baseY = 50 + Math.random() * 40;
  enemies.push({ type:'capsule', x:camX - 14, y:baseY, baseY, w:18, h:10, hp:1, flash:0, vx:2.2, t:0 });
}
function shootAt(x, y, tx, ty, s) {
  const a = Math.atan2(ty - y, tx - x);
  eBullets.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 320 });
}
const onScreen = e => e.x > camX + 4 && e.x < camX + W - 4;
function updateEnemies() {
  const diff = difficulty();
  for (const e of enemies) {
    if (e.flash > 0) e.flash--;
    if (e.type === 'runner') {
      e.anim++; e.x += e.vx; physics(e);
      if (e.onGround && Math.random() < 0.006) e.vy = -6.5;
    } else if (e.type === 'sniper') {
      physics(e);
      if (e.muzzle > 0) e.muzzle--;
      e.facing = player.x < e.x ? -1 : 1;
      if (onScreen(e) && !player.dead && --e.shootT <= 0) {
        const a = Math.atan2((player.y - player.h / 2) - (e.y - 18.5), player.x - e.x);
        shootAt(e.x + Math.cos(a) * 14, e.y - 18.5 + Math.sin(a) * 14, player.x, player.y - player.h / 2, 2 + diff * 0.12);
        e.shootT = 100 - diff * 4 + Math.random() * 40; e.muzzle = 5;
      }
    } else if (e.type === 'drone') {
      e.t += 0.05; e.x += e.vx; e.y = e.baseY + Math.sin(e.t) * 18;
      if (onScreen(e) && !player.dead && --e.shootT <= 0) {
        shootAt(e.x, e.y, player.x, player.y - player.h / 2, 1.8 + diff * 0.08);
        e.shootT = 130 + Math.random() * 60;
      }
    } else if (e.type === 'capsule') {
      e.t += 0.06; e.x += e.vx; e.y = e.baseY + Math.sin(e.t) * 22;
    }
    if (e.type !== 'capsule' && !player.dead && hitPlayer(e.x, e.y, e.w - 2, e.h - 2)) killPlayer();
  }
  enemies = enemies.filter(e => !e.remove && e.x > camX - 60 && e.x < camX + W + 120 && e.y < H + 40);
}
const SCORE = { runner:100, sniper:300, drone:200, capsule:500 };
function killEnemy(e) {
  e.remove = true;
  score += SCORE[e.type];
  explode(e.x, e.y - e.h / 2, e.type !== 'runner');
  if (e.type !== 'runner') shake = Math.max(shake, 5);
  particles.push({ type:'text', txt:String(SCORE[e.type]), x:e.x, y:e.y - e.h - 4, vx:0, vy:-0.5, life:40, max:40 });
  if (e.type === 'capsule')

/* ---------- 子彈、道具、粒子 ---------- */
function updateBullets() {
  for (const b of bullets) {
    b.x += b.vx; b.y += b.vy; b.life--;
    for (const e of enemies) {
      if (e.remove) continue;
      if (Math.abs(b.x - e.x) < e.w / 2 + b.r && b.y > e.y - e.h - b.r && b.y < e.y + b.r) {
        e.hp--; e.flash = 4; b.life = 0; spark(b.x, b.y, b.vx, b.vy);
        if (e.hp <= 0) killEnemy(e);
        break;
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0 && b.x > camX - 10 && b.x < camX + W + 10 && b.y > -10 && b.y < GROUND + 4);
  for (const b of eBullets) {
    b.x += b.vx; b.y += b.vy; b.life--;
    if (!player.dead && hitPlayer(b.x, b.y + 1.5, 3, 3)) { b.life = 0; killPlayer(); }
  }
  eBullets = eBullets.filter(b => b.life > 0 && b.x > camX - 20 && b.x < camX + W + 20 && b.y > -20 && b.y < H + 10);
}
function updateItems() {
  for (const it of items) {
    physics(it); it.t++;
    if (!player.dead && hitPlayer(it.x, it.y, it.w, it.h)) {
      player.weapon = it.kind; it.remove = true; score += 100;
      particles.push({ type:'text', txt:WNAME[it.kind], x:it.x, y:it.y - 14, vx:0, vy:-0.4, life:50, max:50 });
      particles.push({ type:'ring', x:it.x, y:it.y - 5, r:3, vr:1.4, life:18, max:18, c:it.kind === 'S' ? '255,90,74' : '95,220,255' });
      updateHud();
    }
  }
  items = items.filter(i => !i.remove && i.x > camX - 30);
}
function explode(x, y, big) {
  const n = big ? 22 : 12;
  particles.push({ type:'ring', x, y, r:2, vr:big ? 2.4 : 1.7, life:16, max:16, c:'255,210,140' });
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * (big ? 2.8 : 2);
    const life = 16 + Math.random() * 20;
    particles.push({ type:'fire', x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s - 0.4, life, max:life, r:(big ? 5 : 3.5) + Math.random() * 3 });
  }
  for (let i = 0; i < n / 2; i++) {
    const life = 40 + Math.random() * 30;
    particles.push({ type:'smoke', x:x + (Math.random() - 0.5) * 8, y:y + (Math.random() - 0.5) * 8,
      vx:(Math.random() - 0.5) * 0.8, vy:-0.3 - Math.random() * 0.4, life, max:life, r:3 + Math.random() * 3 });
  }
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI * Math.random();
    particles.push({ type:'debris', x, y, vx:Math.cos(a) * 3, vy:Math.sin(a) * 3.5, life:40, max:40, r:1 + Math.random(), rot:Math.random() * 6 });
  }
}
function spark(x, y, vx, vy) {
  const a0 = Math.atan2(-vy, -vx);
  for (let i = 0; i < 5; i++) {
    const a = a0 + (Math.random() - 0.5) * 1.6, s = 1.5 + Math.random() * 2.5;
    particles.push({ type:'spark', x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:10, max:10, r:1 });
  }
}
function dust(x, y) {
  for (let i = 0; i < 6; i++) {
    const life = 18 + Math.random() * 10;
    particles.push({ type:'dust', x:x + (Math.random() - 0.5) * 6, y:y - 1, vx:(Math.random() - 0.5) * 1.6, vy:-Math.random() * 0.5, life, max:life, r:1.5 + Math.random() * 1.5 });
  }
}
function updateParticles() {
  for (const q of particles) {
    q.x += q.vx; q.y += q.vy; q.life--;
    if (q.type === 'debris') { q.vy += 0.22; q.rot += 0.3; }
    else { q.vx *= 0.93; q.vy *= 0.93; }
    if (q.type === 'smoke' || q.type === 'dust') q.r += 0.12;
    if (q.type === 'ring') q.r += q.vr;
  }
  particles = particles.filter(q => q.life > 0);
}

/* ---------- 更新 ---------- */
function update() {
  frame++;
  updatePlayer();
  genWorld(camX + W * 2);
  platforms = platforms.filter(p => p.x + p.w > camX - 60);
  if (--spawnT <= 0) {
    spawnEnemy();
    if (Math.random() < difficulty() / 20) spawnEnemy();
    spawnT = Math.max(30, 100 - difficulty() * 6) * (0.6 + Math.random() * 0.8);
  }
  if (--capsuleT <= 0) { spawnCapsule(); capsuleT = 1100 + Math.random() * 700; }
  updateEnemies(); updateBullets(); updateItems(); updateParticles();
  if (shake > 0) shake--;

}

/* ---------- 背景 ---------- */
const stars = Array.from({ length: 80 }, () => ({ x: Math.random() * W, y: Math.random() * 110, r: Math.random() * 0.7 + 0.2, t: Math.random() * 6 }));

    const L = 17 + (i % 2) * 4;
    const ex = tx + Math.cos(a) * L, ey = ty + Math.sin(a) * L * 0.45 + L * 0.42;
    const mx = tx + Math.cos(a) * L * 0.55, my = ty + Math.sin(a) * L * 0.55 - 3;
    const nx = -Math.sin(a) * 2.6, ny = Math.cos(a) * 2.6;

    ctx.quadraticCurveTo(mx + nx, my + ny, ex, ey);
    ctx.quadraticCurveTo(mx - nx, my - ny + 1.5, tx, ty);

}

  const g = ctx.createLinearGradient(0, 0, 0, GROUND);

  for (const s of stars) {
    ctx.globalAlpha = 0.35 + Math.sin(tick * 0.03 + s.t) * 0.25;
    circle(((s.x - camX * 0.02) % W + W) % W, s.y, s.r, '#fff6e0');
  }

  // 夕陽

  ctx.globalCompositeOperation = 'lighter'; glow(GLOW.sun, sx, sy, 120); ctx.globalCompositeOperation = 'source-over';
  const sg = ctx.createLinearGradient(0, sy - 26, 0, sy + 26);

  for (let i = st; i < st + 11; i++) palm(i * 58 + hash(i) * 26 - o2, GROUND - 22, 44 + hash(i + 9) * 34, '#1d2a3a', tick * 0.02 + i);

function drawPlatforms() {

    ctx.rotate(p.y >= GROUND ? -f * Math.PI / 2 : -f * (80 - p.deadT) * 0.18);
    limb(-1, 3, -1, 11, 3.4, P.pants); limb(1, 3, 2, 11, 3.4, P.pants2);
    limb(0, 3, 0, -4, 7, P.skin); drawHead(0, -7, f, P);
    ctx.restore();
  } else if (!p.onGround) {
    ctx.save(); ctx.translate(X, Y - 10); ctx.rotate(p.spin * f);
    limb(-1.5, 2.5, 3.5 * f, 0.5, 3.8, P.pants2); limb(3.5 * f, 0.5, 0.5 * f, 5, 3.2, P.pants2);
    limb(0, -3, 0, 3, 7, P.skin);
    limb(1.5, 2.5, 5 * f, -0.5, 3.8, P.pants); limb(5 * f, -0.5, 2 * f, 5.5, 3.2, P.pants);
    drawHead(f * 1.5, -5.5, f, P);
    ctx.restore();
  } else if (p.crouch) {
    limb(X - f * 13, Y - 2, X - f * 7, Y - 2.4, 3.3, P.pants2);
    limb(X - f * 7, Y - 2.4, X - f * 1.5, Y - 3, 3.6, P.pants);
    limb(X - f * 14.5, Y - 2.4, X - f * 13, Y - 3.8, 2.4, P.boot);
    limb(X - f * 1.5, Y - 3.4, X + f * 5.5, Y - 4.4, 6.2, P.skin);
    ctx.fillStyle = P.belt; ctx.fillRect(X - f * 2.5 - 1, Y - 6.2, 2, 5.6);
    drawHead(X + f * 9, Y - 6, f, P);
    const s = shoulder(p);
    drawGunAt(s.x - camX, s.y, ang, f, p.flashT > 0, false);
    limb(s.x - camX, s.y + 1.4, s.x - camX + f * 4.5, s.y + 0.9, 2.3, P.skin);
  } else {
    drawRig({ x: X, y: Y, f, pal: P, moving: p.vx !== 0, phase: p.anim * 0.26, aim: ang, flash: p.flashT > 0 });
  }
  ctx.globalAlpha = 1;
  if (!p.onGround && !p.dead && p.flashT > 0) {
    const s = shoulder(p), { dx, dy } = aimDir(p);
    ctx.globalCompositeOperation = 'lighter'; glow(GLOW.gold, s.x - camX + dx * 12, s.y + dy * 12, 8); ctx.globalCompositeOperation = 'source-over';
  }
}
function drawEnemies() {
  for (const e of enemies) {
    const X = e.x - camX, Y = e.y, fl = e.flash > 0;
    if (X < -30 || X > W + 30) continue;
    if (e.type === 'runner') {
      const f = e.vx > 0 ? 1 : -1;
      if (e.onGround) shadow(X, Y);
      drawRig({ x: X, y: Y, f, pal: PAL.runner, moving: e.onGround, phase: e.anim * 0.3, aim: f > 0 ? 0.45 : Math.PI - 0.45, fl });
    } else if (e.type === 'sniper') {
      shadow(X, Y);
      const ang = Math.atan2((player.y - player.h / 2) - (Y - 18.5), player.x - e.x);
      drawRig({ x: X, y: Y, f: e.facing, pal: PAL.sniper, moving: false, phase: 0, aim: ang, flash: e.muzzle > 0, fl });
    } else if (e.type === 'drone') {
      const ex = player.x < e.x ? -1 : 1;
      ctx.save(); ctx.translate(X, Y - 5); ctx.rotate(e.vx * 0.12);
      limb(-10, -3, 10, -3, 1.4, fl ? '#fff' : '#39404c');
      ctx.fillStyle = 'rgba(220,232,245,0.3)';
      const rw = 6 + Math.sin(tick * 1.3) * 0.8;
      ctx.beginPath(); ctx.ellipse(-10, -4.6, rw, 1.1, 0, 0, Math.PI * 2); ctx.ellipse(10, -4.6, rw, 1.1, 0, 0, Math.PI * 2); ctx.fill();
      const g = ctx.createLinearGradient(0, -5, 0, 4.5);
      g.addColorStop(0, fl ? '#fff' : '#c7d0dc'); g.addColorStop(1, fl ? '#fff' : '#434b59');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 7.5, 4.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1f28'; ctx.beginPath(); ctx.ellipse(ex * 2.5, 0.5, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
      circle(ex * 3, 0.5, 1.2, '#ff4040');
      ctx.restore();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.6 + Math.sin(tick * 0.2) * 0.3;
      glow(GLOW.red, X + ex * 3, Y - 4.5, 6);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    } else if (e.type === 'capsule') {
      const wing = Math.sin(tick * 0.5) * 2.5;
      ctx.save(); ctx.translate(X, Y - 5);
      ctx.fillStyle = '#d23b2e';
      ctx.beginPath(); ctx.moveTo(-5, -1); ctx.lineTo(-14, -4 + wing); ctx.lineTo(-11, 1); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(5, -1); ctx.lineTo(14, -4 + wing); ctx.lineTo(11, 1); ctx.closePath(); ctx.fill();
      const g = ctx.createLinearGradient(0, -5, 0, 5);
      g.addColorStop(0, fl ? '#fff' : '#f3f6fa'); g.addColorStop(1, fl ? '#fff' : '#7d8795');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 8, 4.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d23b2e'; ctx.fillRect(-1, -4.6, 2, 9.2);
      ctx.restore();
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5; glow(GLOW.gold, X, Y - 5, 16);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
  }
}
function drawItems() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 7px "Chakra Petch", sans-serif';
  for (const it of items) {
    const x = it.x - camX, y = it.y - 5 - (it.vy === 0 ? Math.abs(Math.sin(it.t * 0.08)) * 2.5 : 0);
    const c = it.kind === 'S' ? '#ff5a4a' : '#5fdcff';
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.55 + Math.sin(it.t * 0.15) * 0.25;
    glow(it.kind === 'S' ? GLOW.red : GLOW.cyan, x, y, 14);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createLinearGradient(0, y - 5, 0, y + 5);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#9aa4b2');
    ctx.fillStyle = g; rrect(x - 7, y - 5, 14, 10, 5); ctx.fill();
    ctx.fillStyle = c; ctx.fillText(it.kind, x, y + 0.5);
  }
}
function drawBullets() {
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const b of bullets) {
    const x = b.x - camX, y = b.y;
    if (b.kind === 'S') {
      glow(GLOW.red, x, y, 10);
      circle(x, y, 2.4, '#ffd2b0');
    } else {
      const img = b.kind === 'R' ? GLOW.cyan : GLOW.gold, col = b.kind === 'R' ? 'rgba(120,230,255,0.7)' : 'rgba(255,200,90,0.7)';
      limb(x - b.vx * 2.2, y - b.vy * 2.2, x, y, 1.6, col);
      glow(img, x, y, 7);
      circle(x, y, 1.3, '#ffffff');
    }
  }
  for (const b of eBullets) {
    const x = b.x - camX, y = b.y, pu = 7 + Math.sin(tick * 0.4 + b.x) * 1.5;
    glow(GLOW.mag, x, y, pu);
    circle(x, y, 1.8, '#ffe0ec');
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawParticles() {
  for (const q of particles) {
    const k = q.life / q.max, x = q.x - camX;
    if (q.type === 'smoke') circle(x, q.y, q.r, `rgba(45,36,48,${0.4 * k})`);
    else if (q.type === 'dust') circle(x, q.y, q.r, `rgba(190,160,120,${0.35 * k})`);
    else if (q.type === 'debris') {
      ctx.save(); ctx.translate(x, q.y); ctx.rotate(q.rot); ctx.fillStyle = `rgba(30,24,20,${k})`;
      ctx.fillRect(-q.r, -q.r * 0.6, q.r * 2, q.r * 1.2); ctx.restore();
    }
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const q of particles) {
    const k = q.life / q.max, x = q.x - camX;
    if (q.type === 'fire') {
      ctx.globalAlpha = Math.min(1, k * 1.4);
      glow(GLOW.fire, x, q.y, q.r * (1.2 + (1 - k) * 1.4));
    } else if (q.type === 'spark') {
      ctx.globalAlpha = k; limb(x, q.y, x - q.vx * 1.5, q.y - q.vy * 1.5, 0.9, '#fff2c0');
    } else if (q.type === 'ring') {
      ctx.globalAlpha = k; ctx.strokeStyle = `rgba(${q.c},${k})`; ctx.lineWidth = 1.6 * k + 0.3;
      ctx.beginPath(); ctx.arc(x, q.y, q.r, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 7.5px "Chakra Petch", sans-serif';
  for (const q of particles) {
    if (q.type !== 'text') continue;
    const k = q.life / q.max;
    ctx.globalAlpha = Math.min(1, k * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(q.txt, q.x - camX + 0.6, q.y + 0.6);
    ctx.fillStyle = '#fff4d6'; ctx.fillText(q.txt, q.x - camX, q.y);
  }
  ctx.globalAlpha = 1;
}
let vignette = null;
function drawPost() {
  if (!vignette) {
    vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(5,6,14,0.55)');
  }
  ctx.fillStyle = vignette; ctx.fillRect(-20, -20, W + 40, H + 40);
  if (flashScreen > 0) { ctx.fillStyle = `rgba(255,230,210,${flashScreen * 0.5})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
}
function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = true;
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 0.5, (Math.random() - 0.5) * shake * 0.5);
  drawBG(); drawGround(); drawPlatforms(); drawItems(); drawEnemies(); drawPlayer(); drawBullets(); drawParticles(); drawPost();
}

/* ---------- 啟動 ---------- */
resetWorld(); updateHud();
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= STEP) { tick++; if (state === 'play') update(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
